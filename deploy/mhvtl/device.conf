# Tapeberg dev rig — mhvtl virtual tape library
# Emulates one LTO-5 library: three drives + 17 storage slots (16 data + 1 cleaning).
# Mirrors the real TANDBERG LTO-5 HH drive on this host (/dev/st0, /dev/sg1)
# so Tapeberg's code path is identical on the VTL and the real hardware.
# Deploy to /etc/mhvtl/device.conf

VERSION: 5

Library: 10 CHANNEL: 00 TARGET: 00 LUN: 00
 Vendor identification: SPECTRA
 Product identification: PYTHON
 Unit serial number: TAPEBERG1
 NAA: 10:22:33:44:ab:00:00:00
 Home directory: /var/lib/mhvtl
 PERSIST: False
 Backoff: 400

Drive: 11 CHANNEL: 00 TARGET: 01 LUN: 00
 Library ID: 10 Slot: 01
 Vendor identification: IBM
 Product identification: ULT3580-TD5
 Product revision level: HB81
 Unit serial number: TB-DRIVE01
