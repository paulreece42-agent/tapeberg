# Tapeberg dev rig — mhvtl runtime config
# Deploy to /etc/mhvtl/mhvtl.conf
#
# Media capacity is deliberately LOW (100 MB/tape): small tapes force
# frequent EOM / tape-swap events, which is exactly what this rig is for.
# Media data files only grow as bytes are actually written, so 17 tapes
# cost at most ~1.7 GB. Bump CAPACITY to 1500000 to emulate real LTO-5
# (1.5 TB) streaming when we want long, realistic runs.

# Home directory for tape emulation files
MHVTL_HOME_PATH=/var/lib/mhvtl

# Default media capacity (MB)
CAPACITY=100

# Set default verbosity [0|1|2|3]
VERBOSE=1

# Set kernel module debugging [0|1]
VTL_DEBUG=0

# vtltape and vtllibrary debugging [Blank or -d]
#DAEMON_DEBUG=-d
